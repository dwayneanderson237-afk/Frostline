{% extends "layout.html" %}

{% block content %}
<div class="inquiry-container">
    <h2>{{ kitten['name'] }} - Inquiry Form</h2>

    <form method="POST" class="inquiry-form">
        <!-- Kitten Name (prefilled) -->
        <div class="form-group">
            <label for="kitten_name">Kitten</label>
            <input type="text" id="kitten_name" name="kitten_name" value="{{ kitten['name'] }}" readonly>
        </div>

        <!-- Form Type (Buy or Reserve) -->
        <div class="form-group">
            <label for="form_type">Action</label>
            <select id="form_type" name="form_type" required>
                <option value="Buy">Buy</option>
                <option value="Reserve">Reserve ($200 Fee)</option>
            </select>
        </div>

        <!-- Client Name -->
        <div class="form-group">
            <label for="client_name">Your Name</label>
            <input type="text" id="client_name" name="client_name" placeholder="Full Name" required>
        </div>

        <!-- Client Email -->
        <div class="form-group">
            <label for="client_email">Email</label>
            <input type="email" id="client_email" name="client_email" placeholder="you@example.com" required>
        </div>

        <!-- Payment Method -->
        <div class="form-group">
            <label for="payment_method">Payment Method</label>
            <select id="payment_method" name="payment_method" required>
                <option value="">Select Payment</option>
                <option value="CashApp">CashApp</option>
                <option value="Zelle">Zelle</option>
                <option value="Venmo">Venmo</option>
                <option value="Apple Pay">Apple Pay</option>
                <option value="Bank Transfer" id="bank-option">Bank Transfer</option>
            </select>
        </div>

        <!-- Delivery Option -->
        <div class="form-group">
            <label for="delivery">Delivery Option</label>
            <select id="delivery" name="delivery" required>
                <option value="">Select</option>
                <option value="Pickup">Pickup</option>
                <option value="Delivery">Delivery</option>
            </select>
        </div>

        <!-- Address (shown only if Delivery is selected) -->
        <div class="form-group" id="address-group" style="display:none;">
            <label for="address">Delivery Address</label>
            <input type="text" id="address" name="address" placeholder="Enter delivery address">
        </div>

        <button type="submit" class="btn-submit">Submit {{ form_type or "" }}</button>
    </form>
</div>

<script>
    const deliverySelect = document.getElementById('delivery');
    const addressGroup = document.getElementById('address-group');

    const formTypeSelect = document.getElementById('form_type');
    const bankOption = document.getElementById('bank-option');

    // Show address if delivery is selected
    deliverySelect.addEventListener('change', () => {
        if (deliverySelect.value === 'Delivery') {
            addressGroup.style.display = 'block';
            document.getElementById('address').required = true;
        } else {
            addressGroup.style.display = 'none';
            document.getElementById('address').required = false;
        }
    });

    // Hide bank transfer if reservation
    formTypeSelect.addEventListener('change', () => {
        if (formTypeSelect.value === 'Reserve') {
            bankOption.style.display = 'none';
            if (document.getElementById('payment_method').value === 'Bank Transfer') {
                document.getElementById('payment_method').value = '';
            }
        } else {
            bankOption.style.display = 'block';
        }
    });
</script>

<style>
.inquiry-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.inquiry-form .form-group {
    margin-bottom: 15px;
}

.inquiry-form label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
}

.inquiry-form input,
.inquiry-form select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.btn-submit {
    background-color: #E63946;
    color: #fff;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.btn-submit:hover {
    background-color: #D62828;
}
</style>
{% endblock %}
