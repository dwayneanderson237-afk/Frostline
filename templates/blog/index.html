{% extends "layout.html" %}
{% block extra_meta %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "Maine Coon Blog",
  "url": {{ canonical_url|tojson }},
  "publisher": {
    "@type": "Organization",
    "name": {{ (site_settings.get('business_name') or 'Frostline Coons')|tojson }}
  }
}
</script>
{% endblock %}
{% block content %}

<section class="blog-hero">
  <div class="hero-text">
    <h1>Maine Coon Blog</h1>
    <p>Guides, care tips, and breed insights for happy, healthy Maine Coons.</p>
  </div>
</section>

<section class="blog-list">
  <div class="blog-grid">
    {% for post in posts %}
    <article class="blog-card">
      <a href="{{ url_for('blog_post', slug=post.slug) }}">
        <img src="{{ media_url(post.cover_image or 'images/hero_kitten.jpg') }}" alt="{{ post.title }}" loading="lazy" decoding="async">
      </a>
      <div class="blog-card-body">
        <span class="blog-date">{{ post.published_at }}</span>
        <h2><a href="{{ url_for('blog_post', slug=post.slug) }}">{{ post.title }}</a></h2>
        <p>{{ post.excerpt }}</p>
        <a class="view-btn" href="{{ url_for('blog_post', slug=post.slug) }}">Read More</a>
      </div>
    </article>
    {% endfor %}
  </div>
</section>

{% endblock %}
