{% extends "admin/layout.html" %}

{% block content %}
<div class="admin-header">
    <div>
        <h1>{{ "Add Blog Post" if mode == "new" else "Edit Blog Post" }}</h1>
        <p>SEO fields help this content rank well in search.</p>
    </div>
    <a class="admin-btn" href="{{ url_for('admin_blog') }}">Back to list</a>
</div>

<form method="POST" enctype="multipart/form-data" class="admin-form">
    <label>Title</label>
    <input type="text" name="title" value="{{ post.title if post else '' }}" required>

    <label>Slug (optional)</label>
    <input type="text" name="slug" value="{{ post.slug if post else '' }}">

    <label>Excerpt</label>
    <textarea name="excerpt" rows="3">{{ post.excerpt if post else '' }}</textarea>

    <label>Content (separate paragraphs with a blank line)</label>
    <textarea name="content" rows="10">{{ post.content if post else '' }}</textarea>

    <label>Meta Title</label>
    <input type="text" name="meta_title" value="{{ post.meta_title if post else '' }}">

    <label>Meta Description</label>
    <textarea name="meta_description" rows="3">{{ post.meta_description if post else '' }}</textarea>

    <label>Keywords (comma separated)</label>
    <input type="text" name="keywords" value="{{ post.keywords if post else '' }}">

    <label>Cover Image Path</label>
    <input type="text" name="cover_image" value="{{ post.cover_image if post else '' }}">

    <label>Upload Cover Image</label>
    <input type="file" name="cover_upload" accept=".jpg,.jpeg,.png,.webp">

    <label>Status</label>
    <select name="status">
        <option value="published" {% if post and post.status == 'published' %}selected{% endif %}>Published</option>
        <option value="draft" {% if post and post.status == 'draft' %}selected{% endif %}>Draft</option>
    </select>

    <label>Publish Date (optional)</label>
    <input type="datetime-local" name="published_at">

    <button type="submit" class="admin-btn primary">
        {{ "Create Post" if mode == "new" else "Save Changes" }}
    </button>
</form>
{% endblock %}
